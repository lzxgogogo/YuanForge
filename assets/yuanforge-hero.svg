<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">YuanForge builds the Yuan Layer</title>
  <desc id="desc">A visual showing YuanForge creating durable project metadata for agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#17243b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="yuan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcc66"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="180" fill="#ff9f43" opacity=".06"/>
  <circle cx="120" cy="450" r="220" fill="#4f8cff" opacity=".06"/>

  <g transform="translate(70 64)">
    <rect width="260" height="392" rx="28" fill="#111d31" stroke="#334766" filter="url(#shadow)"/>
    <rect x="26" y="28" width="70" height="70" rx="20" fill="url(#yuan)"/>
    <path d="M42 48h11l8 11 8-11h11L66 66v12H56V66z" fill="#101827"/>
    <path d="M45 75h32l6 8H39z" fill="#101827" opacity=".78"/>
    <text x="26" y="142" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="750">YuanForge</text>
    <text x="26" y="177" fill="#9db0cc" font-family="Inter,Segoe UI,sans-serif" font-size="18">forge project metadata</text>

    <g font-family="Inter,Segoe UI,sans-serif" font-size="16">
      <rect x="26" y="220" width="208" height="40" rx="12" fill="#1d2c45"/>
      <text x="44" y="246" fill="#ffd27a">bootstrap</text>
      <rect x="26" y="270" width="208" height="40" rx="12" fill="#1d2c45"/>
      <text x="44" y="296" fill="#9ec5ff">audit</text>
      <rect x="26" y="320" width="99" height="40" rx="12" fill="#1d2c45"/>
      <text x="44" y="346" fill="#a8e6cf">repair</text>
      <rect x="135" y="320" width="99" height="40" rx="12" fill="#1d2c45"/>
      <text x="153" y="346" fill="#d7b5ff">evolve</text>
    </g>
  </g>

  <path d="M356 260h90" stroke="#526987" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M432 249l18 11-18 11z" fill="#526987"/>

  <g transform="translate(470 52)" font-family="Inter,Segoe UI,sans-serif">
    <text x="0" y="30" fill="#f8fafc" font-size="30" font-weight="700">Yuan Layer</text>
    <text x="0" y="58" fill="#91a4c0" font-size="17">the metadata agents build by</text>

    <g transform="translate(0 92)" filter="url(#shadow)">
      <rect width="285" height="102" rx="18" fill="#172a44" stroke="#3d5f8a"/>
      <circle cx="34" cy="34" r="12" fill="#ffb45e"/>
      <text x="58" y="40" fill="#f8fafc" font-size="20" font-weight="650">Intent · Flow</text>
      <text x="24" y="74" fill="#9fb2cd" font-size="15">brief · workflow</text>
    </g>

    <g transform="translate(305 92)" filter="url(#shadow)">
      <rect width="285" height="102" rx="18" fill="#172a44" stroke="#3d5f8a"/>
      <circle cx="34" cy="34" r="12" fill="#73aaff"/>
      <text x="58" y="40" fill="#f8fafc" font-size="20" font-weight="650">Method · Structure</text>
      <text x="24" y="74" fill="#9fb2cd" font-size="15">method · interaction · structure</text>
    </g>

    <g transform="translate(0 214)" filter="url(#shadow)">
      <rect width="180" height="102" rx="18" fill="#172a44" stroke="#3d5f8a"/>
      <circle cx="34" cy="34" r="12" fill="#83d8b0"/>
      <text x="58" y="40" fill="#f8fafc" font-size="20" font-weight="650">Delivery</text>
      <text x="24" y="74" fill="#9fb2cd" font-size="15">Implementation</text>
    </g>

    <g transform="translate(200 214)" filter="url(#shadow)">
      <rect width="180" height="102" rx="18" fill="#172a44" stroke="#3d5f8a"/>
      <circle cx="34" cy="34" r="12" fill="#c49cff"/>
      <text x="58" y="40" fill="#f8fafc" font-size="20" font-weight="650">Control</text>
      <text x="24" y="74" fill="#9fb2cd" font-size="15">Agents · Worktrees</text>
    </g>

    <g transform="translate(400 214)" filter="url(#shadow)">
      <rect width="190" height="102" rx="18" fill="#172a44" stroke="#3d5f8a"/>
      <circle cx="34" cy="34" r="12" fill="#ff8f8f"/>
      <text x="58" y="40" fill="#f8fafc" font-size="20" font-weight="650">Memory</text>
      <text x="24" y="74" fill="#9fb2cd" font-size="15">Progress · Lessons</text>
    </g>

    <rect x="0" y="342" width="590" height="58" rx="16" fill="#0f1a2c" stroke="#2d425f"/>
    <text x="24" y="378" fill="#d8e2f0" font-size="16">project evidence  →  reviewed metadata  →  reliable agents</text>
  </g>
</svg>
